# Hartland's trusted builder. Callers (a hartland-packages repo or a fork) run:
#
#   jobs:
#     attest:
#       permissions: {contents: read, packages: write, id-token: write, actions: write}
#       uses: nhawkes/hartland/.github/workflows/build.yml@<commit>
#
# As the coordinator (role: coordinator, the default) it runs the build and
# dispatches worker runs of the caller's workflow on demand, passing
# role: worker and its own key and run. A worker joins that coordinator,
# runs the actions it is sent in the sandbox, and leaves when idle.
#
# Keyrings trust this file at pinned commits on GitHub-hosted runners. All
# trusted code is fetched from hartland at the builder's own commit, read from
# the job's OIDC token (job_workflow_sha), never from the caller.
name: hartland-build
on:
  workflow_call:
    inputs:
      targets:
        description: buck2 target patterns to build
        type: string
        default: "//..."
      publish_results:
        description: push logs to the caller's attest-results branch (needs contents write)
        type: boolean
        default: false
      role:
        description: coordinator (build, dispatch workers) or worker (dispatched)
        type: string
        default: coordinator
      coordinator:
        description: "worker only: the coordinator's public key"
        type: string
        default: ""
      coordinator_run:
        description: "worker only: the coordinator's run id"
        type: string
        default: ""
      max_workers:
        description: most workers the coordinator dispatches at once (0 disables scale-out)
        type: number
        default: 4
jobs:
  build:
    if: inputs.role != 'worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ github.token }}
    steps:
      - name: Identify this builder
        id: self
        shell: bash
        run: |
          set -euo pipefail
          sha="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hartland-builder-identity" \
            | python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; t+="="*(-len(t)%4); c=json.loads(base64.urlsafe_b64decode(t)); assert c["job_workflow_ref"].startswith("nhawkes/hartland/.github/workflows/build.yml@"), c["job_workflow_ref"]; print(c["job_workflow_sha"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "builder commit $sha"
      - name: Fetch hartland at the builder commit
        shell: bash
        run: |
          git init -q hl && cd hl
          git fetch -q --depth 1 https://github.com/nhawkes/hartland "${{ steps.self.outputs.sha }}"
          git checkout -q FETCH_HEAD
      - name: Fetch the caller
        shell: bash
        run: |
          git init -q caller && cd caller
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git -c http.extraheader="$auth" submodule update -q --init --depth 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Workers run the CLI this job compiles, so they need not compile it.
      # The Actions cache is untrusted, so the binary travels with a token
      # whose audience is its digest; workers check it (ci/verify-binary.py)
      # before running it.
      - name: Build and certify the hartland CLI
        if: inputs.max_workers > 0
        shell: bash
        run: |
          set -euo pipefail
          (cd hl/cli && cargo build --locked --release -q)
          bin="$RUNNER_TEMP/hartland-bin" && mkdir -p "$bin" && cp hl/cli/target/release/hartland "$bin/"
          digest="$(sha256sum "$bin/hartland" | cut -d' ' -f1)"
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hartland-binary:sha256:$digest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' > "$bin/token"
          echo "hartland CLI sha256:$digest"
      - name: Cache the certified CLI for workers
        if: inputs.max_workers > 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hartland-bin
          key: hartland-bin-${{ steps.self.outputs.sha }}-${{ github.run_id }}
      # First cache tier: signed batches and their blobs in GitHub's Actions
      # cache (untrusted transport: verified on load like everything else).
      - name: Free disk (preinstalled SDKs no action uses)
        shell: bash
        # Hosted runners ship ~25 GB of SDKs (Android, .NET, GHC, CodeQL,
        # Swift); actions run only graph-built tools and the seeds, so none
        # of it is used. In the background: the build does not wait for it.
        run: |
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift >/dev/null 2>&1 &
      - name: Restore first-tier cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hartland-l1
          key: hartland-l1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hartland-l1-
      - name: Attested build
        shell: bash
        run: bash hl/ci/attested-build.sh hl caller "${{ inputs.targets }}" results
        env:
          BUILDER_SHA: ${{ steps.self.outputs.sha }}
          HARTLAND_L1: ${{ runner.temp }}/hartland-l1
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_WORKERS: ${{ inputs.max_workers }}
          # Only the coordinator process sees it (buck2 and actions run with
          # empty environments): it dispatches workers.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save first-tier cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hartland-l1
          key: hartland-l1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish logs
        if: always() && inputs.publish_results
        shell: bash
        run: |
          mkdir -p results && cd results
          git init -q && git checkout -q -b results
          git -c user.name=hartland -c user.email=hartland@invalid add -A
          git -c user.name=hartland -c user.email=hartland@invalid commit -qm "attested build logs for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push -qf "https://github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/attest-results
        env:
          GITHUB_TOKEN: ${{ github.token }}

  worker:
    if: inputs.role == 'worker'
    runs-on: ubuntu-24.04
    # A hard limit; a worker normally leaves after a minute without work.
    timeout-minutes: 90
    steps:
      - name: Identify this builder
        id: self
        shell: bash
        run: |
          set -euo pipefail
          sha="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hartland-builder-identity" \
            | python3 -c 'import base64,json,sys; t=json.load(sys.stdin)["value"].split(".")[1]; t+="="*(-len(t)%4); c=json.loads(base64.urlsafe_b64decode(t)); assert c["job_workflow_ref"].startswith("nhawkes/hartland/.github/workflows/build.yml@"), c["job_workflow_ref"]; print(c["job_workflow_sha"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Fetch hartland at the builder commit
        shell: bash
        run: |
          git init -q hl && cd hl
          git fetch -q --depth 1 https://github.com/nhawkes/hartland "${{ steps.self.outputs.sha }}"
          git checkout -q FETCH_HEAD
      - name: Restore the coordinator's CLI
        id: bin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hartland-bin
          key: hartland-bin-${{ steps.self.outputs.sha }}-${{ inputs.coordinator_run }}
      - name: Check it is the builder's own (else compile from source)
        if: steps.bin.outputs.cache-hit == 'true'
        shell: bash
        run: |
          bin="$RUNNER_TEMP/hartland-bin"
          if python3 hl/ci/verify-binary.py hl/keys/github-actions-jwks.json "$bin/token" "$bin/hartland" \
              nhawkes/hartland/.github/workflows/build.yml "${{ steps.self.outputs.sha }}" "$GITHUB_REPOSITORY"; then
            mkdir -p hl/cli/target/release && cp "$bin/hartland" hl/cli/target/release/hartland
          fi
      - name: Free disk (preinstalled SDKs no action uses)
        shell: bash
        # Hosted runners ship ~25 GB of SDKs (Android, .NET, GHC, CodeQL,
        # Swift); actions run only graph-built tools and the seeds, so none
        # of it is used. In the background: the build does not wait for it.
        run: |
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift >/dev/null 2>&1 &
      - name: Work
        shell: bash
        run: bash hl/ci/attested-worker.sh hl 2>&1 | tee "$RUNNER_TEMP/worker.log"
        env:
          BUILDER_SHA: ${{ steps.self.outputs.sha }}
          COORDINATOR: ${{ inputs.coordinator }}
          COORDINATOR_RUN: ${{ inputs.coordinator_run }}
      # Workers' logs, one file per worker run, on a branch per coordinator
      # run (attest-workers/<run>), so a failed join is visible.
      - name: Publish log
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/worker.log"
          [ -s "$log" ] || echo "no log: the worker failed before it started" > "$log"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          url="https://github.com/$GITHUB_REPOSITORY"
          branch="attest-workers/${{ inputs.coordinator_run }}"
          mkdir logs && cd logs && git init -q
          for attempt in 1 2 3 4 5; do
            # On top of what other workers pushed, if anything.
            if git -c http.extraheader="$auth" fetch -q --depth 1 "$url" "$branch" 2>/dev/null; then
              git reset -q --hard FETCH_HEAD
            fi
            cp "$log" "$GITHUB_RUN_ID.log"
            git add "$GITHUB_RUN_ID.log"
            git -c user.name=hartland -c user.email=hartland@invalid commit -qm "worker run $GITHUB_RUN_ID"
            git -c http.extraheader="$auth" push -q "$url" "HEAD:refs/heads/$branch" && break
            sleep $((attempt * 2))
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
