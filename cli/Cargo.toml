[package]
name = "hartland"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-queue = "0.3.14"
futures = "0.3.34"
gix = { version = "0.90.0", default-features = false, features = ["blocking-http-transport-reqwest", "sha1"] }
hex = "0.4.3"
iroh = "1.4.1"
monostate = "1.0.3"
nix = { version = "0.31.3", features = ["user", "fs"] }
oci-spec = { version = "0.10.0", default-features = false, features = ["image"] }
papaya = "0.2.5"
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "query"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3.24.0", default-features = false, features = ["macros", "base64", "hex", "std"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "time", "sync", "process"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
walkdir = "2.5.0"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
