[package]
name = "hartland"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
prost = "0.14.4"
prost-types = "0.14.4"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net"] }
tokio-stream = "0.1.19"
tonic = "0.14.9"
tonic-prost = "0.14.9"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"
